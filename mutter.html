<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Unerwartetes Ereignis</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #2c3e50, #34495e);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.container {
  text-align: center;
}

.role {
  margin-bottom: 15px;
  font-size: 18px;
  opacity: 0.8;
}

.card {
  background: white;
  color: #333;
  padding: 40px;
  border-radius: 20px;
  width: 320px;
  min-height: 150px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.4);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pop 0.6s ease-out;
}

@keyframes finale {
  0% { transform: scale(1); }
  40% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.finale-effect {
  animation: finale 0.5s ease-out;
}

h1 {
  margin-bottom: 30px;
  letter-spacing: 2px;
}

.amount {
  font-size: 26px;
  font-weight: bold;
  color: #e74c3c;
}
</style>

</head>
<body>

<div class="container">
  <h1>🎲 EREIGNIS 🎲</h1>
  <div class="role">Rolle: Alleinerziehende Mutter</div>
  <div class="card" id="situation">...</div>
</div>

<script>

const situationen = [
"💥 Die Waschmaschine ist kaputt! <br><br><span class='amount'>-250 €</span>",
"⚠️ Schulausflug für 3 Kinder. <br><br><span class='amount'>-36 €</span>",
"🔥 Strompreise steigen. <br><br><span class='amount'>-45 €</span>",
"👟 Neue Schuhe für ein Kind. <br><br><span class='amount'>-60 €</span>",
"🤒 4 Tage krank – kein Einkommen!"
];

let index;
let delay = 40;        // počáteční rychlost
let maxDelay = 600;    // nejpomalejší rychlost
let beschleunigung = 30; // o kolik se zpomalí každý krok

function mischen() {
    index = Math.floor(Math.random() * situationen.length);
    document.getElementById("situation").innerHTML = situationen[index];

    if (delay < maxDelay) {
        delay += beschleunigung;
        setTimeout(mischen, delay);
        } else {
        const card = document.getElementById("situation");
        card.innerHTML = situationen[index];
        
        // přidání efektu zvětšení
        card.classList.add("finale-effect");

        // odstranění třídy po dokončení animace (aby šla znovu použít)
        setTimeout(() => {
            card.classList.remove("finale-effect");
        }, 500);
    }
}

// start losování po načtení stránky
window.onload = function() {
    mischen();
};

</script>

</body>
</html>
